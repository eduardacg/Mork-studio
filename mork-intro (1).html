<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MØRK Studio — Tattoo • Piercing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500&family=Jost:wght@300&display=swap" rel="stylesheet">
<style>
  :root{
    --black:#050505;
    --ivory:#f3f1ec;
    --silver:#b9b6ae;
    --serif:"Cinzel","Trajan Pro","Times New Roman",serif;
    --sans:"Jost","Helvetica Neue",Arial,sans-serif;
  }
  *{box-sizing:border-box;margin:0}
  html,body{height:100%;background:var(--black);color:var(--ivory);font-family:var(--sans)}

  /* ====== SEU SITE (placeholder) ====== */
  .site{min-height:100%;display:grid;place-items:center;text-align:center;padding:2rem}
  .site p{color:var(--silver);letter-spacing:.2em;font-weight:300}

  /* ====== INTRO ====== */
  .intro{
    position:fixed;inset:0;z-index:9999;background:var(--black);
    display:grid;place-items:center;overflow:hidden;
    transition:opacity 1s ease, transform 1.2s cubic-bezier(.7,0,.2,1), visibility 0s 1.2s;
  }
  .intro.is-leaving{opacity:0;transform:scale(1.06);visibility:hidden}

  /* luz que revela a placa */
  .intro::before{
    content:"";position:absolute;width:140vmax;height:140vmax;left:50%;top:50%;
    transform:translate(-50%,-50%);
    background:radial-gradient(closest-side,rgba(255,255,255,.10),rgba(255,255,255,0) 60%);
    opacity:0;animation:glow 3.2s .2s ease-out forwards;
  }
  @keyframes glow{to{opacity:1}}

  .logo{position:relative;display:grid;justify-items:center;text-align:center;padding:0 5vw}

  .row{display:flex;justify-content:center;white-space:nowrap}
  .ch{
    display:inline-block;position:relative;opacity:0;
    transform:translateY(.18em);filter:blur(14px);
    animation:ch-in 1.1s cubic-bezier(.2,.7,.2,1) forwards;
    animation-delay:calc(var(--d) * 1s);
  }
  @keyframes ch-in{to{opacity:1;transform:none;filter:blur(0)}}

  /* MØRK */
  .mork{
    font-family:var(--serif);font-weight:500;color:var(--ivory);
    font-size:clamp(3.2rem,15vw,11rem);line-height:1;letter-spacing:.06em;
    text-shadow:0 .02em 0 rgba(255,255,255,.35), 0 .06em .12em rgba(0,0,0,.9);
  }
  .mork .ch{margin-right:.06em}

  /* a barra do Ø: o corte, único momento de destaque */
  .slash{
    position:absolute;left:-12%;top:-14%;width:124%;height:128%;
    overflow:visible;pointer-events:none;
  }
  .slash line{
    stroke:var(--ivory);stroke-width:3.2;stroke-linecap:square;
    stroke-dasharray:140;stroke-dashoffset:140;
    filter:drop-shadow(0 0 6px rgba(255,255,255,.55));
    animation:cut .55s cubic-bezier(.6,0,.2,1) 1.55s forwards;
  }
  @keyframes cut{to{stroke-dashoffset:0}}

  /* STUDIO */
  .studio{
    margin-top:clamp(.6rem,2.4vw,1.8rem);
    font-family:var(--sans);font-weight:300;color:var(--ivory);
    font-size:clamp(1.3rem,5.4vw,4rem);line-height:1;
    letter-spacing:.9em;margin-right:-.9em; /* compensa o espaço final do tracking */
    width:100%;justify-content:space-between;
  }

  /* TATTOO • PIERCING */
  .tag{
    margin-top:clamp(1.2rem,4vw,3rem);
    font-family:var(--sans);font-weight:300;color:var(--silver);
    font-size:clamp(.62rem,1.7vw,1.15rem);letter-spacing:.5em;margin-right:-.5em;
    opacity:0;animation:fade 1.4s 3.1s ease forwards;
  }
  @keyframes fade{to{opacity:1}}

  /* brilho que atravessa o metal, uma vez só */
  .shine{
    position:absolute;inset:-10% -10%;pointer-events:none;mix-blend-mode:soft-light;
    background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.9) 50%,transparent 60%);
    background-size:250% 100%;background-position:130% 0;
    animation:sweep 1.8s 3.3s ease-in-out forwards;
  }
  @keyframes sweep{to{background-position:-30% 0}}

  /* pular */
  .skip{
    position:absolute;right:1.5rem;bottom:1.5rem;
    background:none;border:1px solid rgba(243,241,236,.25);color:var(--silver);
    font:300 .8rem var(--sans);letter-spacing:.2em;padding:.6rem 1rem;cursor:pointer;
    opacity:0;animation:fade .6s 1s ease forwards;
    transition:border-color .2s,color .2s;
  }
  .skip:hover,.skip:focus-visible{color:var(--ivory);border-color:var(--ivory);outline:none}

  @media (prefers-reduced-motion:reduce){
    .ch{animation-duration:.01s;animation-delay:0s;filter:none;transform:none}
    .slash line{animation-duration:.01s;animation-delay:0s}
    .tag{animation-duration:.01s;animation-delay:0s}
    .shine,.intro::before{display:none}
  }
</style>
</head>
<body>

<!-- ====== SEU SITE AQUI ====== -->
<main class="site"></main>

<!-- ====== INTRO ====== -->
<div class="intro" id="intro" role="img" aria-label="MØRK Studio — Tattoo e Piercing">
  <div class="logo" aria-hidden="true">
    <div class="row mork" id="mork"></div>
    <div class="row studio" id="studio"></div>
    <div class="tag">TATTOO &bull; PIERCING</div>
    <div class="shine"></div>
  </div>
  <button class="skip" id="skip" type="button">PULAR</button>
</div>

<script>
(function () {
  var intro = document.getElementById('intro');
  var KEY = 'mork-intro-seen';

  // mostra só uma vez por sessão (remova este bloco para mostrar sempre)
  try { if (sessionStorage.getItem(KEY)) { intro.remove(); return; } } catch (e) {}

  function build(el, text, start, step, special) {
    text.split('').forEach(function (c, i) {
      var s = document.createElement('span');
      s.className = 'ch';
      s.style.setProperty('--d', (start + i * step).toFixed(2));
      if (special && c === 'Ø') {
        // O + barra desenhada por cima (o "corte")
        s.textContent = 'O';
        s.insertAdjacentHTML('beforeend',
          '<svg class="slash" viewBox="0 0 100 100" preserveAspectRatio="none">' +
          '<line x1="84" y1="-2" x2="16" y2="102"/></svg>');
      } else {
        s.textContent = c;
      }
      el.appendChild(s);
    });
  }

  build(document.getElementById('mork'),   'MØRK',   0.5, 0.28, true);
  build(document.getElementById('studio'), 'STUDIO', 2.0, 0.12, false);

  var done = false;
  function leave() {
    if (done) return; done = true;
    try { sessionStorage.setItem(KEY, '1'); } catch (e) {}
    intro.classList.add('is-leaving');
    setTimeout(function () { intro.remove(); }, 1300);
  }

  document.getElementById('skip').addEventListener('click', leave);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') leave(); });

  var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  setTimeout(leave, reduced ? 800 : 5600);
})();
</script>
</body>
</html>
